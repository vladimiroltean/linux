%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/fsl/fsl,layerscape-dcfg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Freescale Layerscape Device Configuration Unit

maintainers:
  - Shawn Guo <shawnguo@kernel.org>

description: |
  DCFG is the device configuration unit, that provides general purpose
  configuration and status for the device. Such as setting the secondary
  core start address and release the secondary core from holdoff and
  startup.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - fsl,ls1012a-dcfg
              - fsl,ls1021a-dcfg
              - fsl,ls1043a-dcfg
              - fsl,ls1046a-dcfg
              - fsl,ls1088a-dcfg
              - fsl,ls2080a-dcfg
              - fsl,lx2160a-dcfg
          - const: syscon

      - items:
          - enum:
              - fsl,ls1028a-dcfg
              - fsl,lx2160a-dcfg
          - const: syscon
          - const: simple-mfd

  reg:
    minItems: 1
    items:
      - description:
          Customer-visible DCFG register map from CCSR address space
          (Configuration, Control and Status Registers)
      - description:
          Customer-hidden DCFG register map from DCSR address space
          (Debug Control and Status Registers)

  reg-names:
    minItems: 1
    items:
      - const: dcfg_ccsr
      - const: dcfg_dcsr

  little-endian: true
  big-endian: true

  '#address-cells':
    const: 1

  '#size-cells':
    const: 1

  ranges: true

patternProperties:
  "^clock-controller@[0-9a-f]+$":
    $ref: /schemas/clock/fsl,flexspi-clock.yaml#

  "^pinctrl@[0-9a-f]+$":
    $ref: /schemas/pinctrl/fsl,lx2160a-rcw-pinmux.yaml#
    description:
      The pad muxes of the RCW on the LX2160A, at their RCWSR12 to RCWSR14
      and RCWSR27 windows, overridden through the DCSR view of this block.

required:
  - compatible
  - reg

allOf:
  - if:
      not:
        properties:
          compatible:
            contains:
              const: fsl,lx2160a-dcfg
    then:
      patternProperties:
        "^pinctrl@[0-9a-f]+$": false

additionalProperties: false

examples:
  - |
    syscon@1ee0000 {
        compatible = "fsl,ls1021a-dcfg", "syscon";
        reg = <0x1ee0000 0x10000>;
    };
